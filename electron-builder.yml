appId: com.zapret.gui
productName: Zapret GUI
copyright: Copyright © 2026 avencores
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - bundled-assets/**/*
extraResources:
  - from: bundled-assets
    to: bundled-assets
win:
  icon: bundled-assets/icon.ico
  target:
    - nsis
  requestedExecutionLevel: requireAdministrator
  # Apply icon + metadata via rcedit, but skip code signing (no certificate).
  signExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerIcon: bundled-assets/icon.ico
  installerHeaderIcon: bundled-assets/icon.ico
  uninstallerIcon: bundled-assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Zapret GUI
  # NSIS installer itself requests elevation; the app also re-asks via UAC on demand.
  perMachine: false
publish:
  provider: github
  owner: AvenCores
  repo: zapret-gui-nodejs
  releaseType: release
