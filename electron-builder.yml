appId: com.zapret.gui
productName: zapret-gui
copyright: Copyright © 2026 avencores
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - bundled-assets/**/*
extraResources:
  - from: bundled-assets
    to: bundled-assets
win:
  icon: bundled-assets/icon.ico
  target:
    - nsis
    - zip
  requestedExecutionLevel: requireAdministrator
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerHeaderIcon: bundled-assets/icon.ico
  uninstallerIcon: bundled-assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: zapret-gui
  # NSIS installer itself requests elevation; the app also re-asks via UAC on demand.
  perMachine: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
publish:
  provider: github
  owner: AvenCores
  repo: zapret-gui-nodejs
  releaseType: release
