# Build + validate zapret-gui (Windows x64)
#
# Triggers:
# - push to main      -> build installer, upload as artifacts
# - workflow_dispatch -> manual build
#
# NOTE: tags v* intentionally do NOT trigger this workflow. Releases are
# built + published solely by release.yml — running both used to publish
# the installer twice (plus a stray .blockmap) into the same Release.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron toolchain
        # electron-builder downloads Electron + NSIS/winCodeSign tooling from
        # GitHub releases on every cold run; a warm cache turns a transient
        # 504 from that download step into a non-issue.
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-tools-${{ runner.os }}-

      - name: Verify bundled assets
        shell: pwsh
        run: |
          if (-not (Test-Path 'bundled-assets/bin/winws.exe')) {
            Write-Error 'bundled-assets/bin/winws.exe missing. Commit bundled-assets/ or add a step that downloads the upstream release ZIP.'
            exit 1
          }
          if (-not (Test-Path 'bundled-assets/WinDivert64.sys') -and -not (Test-Path 'bundled-assets/bin/WinDivert64.sys')) {
            Write-Error 'WinDivert64.sys missing under bundled-assets/bin/.'
            exit 1
          }
          npm run generate:strategies
          npm test
          npm run lint

      - name: Build installer
        # Retried: the packaging step downloads external toolchain bits and
        # occasionally hits transient HTTP 5xx from the mirror.
        # (nick-fields/retry is stuck on the Node 20 runtime, so the retry
        # loop is inline pwsh instead of a third-party action.)
        shell: pwsh
        timeout-minutes: 75
        run: |
          $attempt = 0
          $maxAttempts = 3
          while ($true) {
            $attempt++
            npm run build:win
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge $maxAttempts) {
              Write-Error "npm run build:win failed after $maxAttempts attempts."
              exit 1
            }
            Write-Warning "Build attempt $attempt/$maxAttempts failed, retrying in 10s…"
            Start-Sleep -Seconds 10
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zapret-gui-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
