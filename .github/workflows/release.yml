# Create a GitHub Release with auto-generated changelog when a v* tag is pushed.
# This is the ONLY release publisher: keep publishing out of build.yml,
# otherwise the installer (+ .blockmap) lands in the Release twice.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron toolchain
        # See build.yml: warm cache + retries survive transient 5xx while
        # electron-builder fetches its NSIS/winCodeSign toolchain.
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-tools-${{ runner.os }}-

      - name: Build
        # Retried inline in pwsh: nick-fields/retry is stuck on Node 20.
        shell: pwsh
        timeout-minutes: 75
        run: |
          $attempt = 0
          $maxAttempts = 3
          while ($true) {
            $attempt++
            npm run build:win
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge $maxAttempts) {
              Write-Error "npm run build:win failed after $maxAttempts attempts."
              exit 1
            }
            Write-Warning "Build attempt $attempt/$maxAttempts failed, retrying in 10s…"
            Start-Sleep -Seconds 10
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $prev = (git describe --tags --abbrev=0 HEAD~1 2>$null)
          if (-not $prev) { $prev = (git rev-list --max-parents=0 HEAD) }
          $log = (git log "$prev..HEAD" --pretty=format:'- %s (%h)') -join "`n"
          if (-not $log) { $log = '- maintenance build' }
          "notes<<EOF" >> $env:GITHUB_OUTPUT
          $log >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## Zapret GUI ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.notes }}

            ### Install
            - Download `Zapret-GUI-Setup-*.exe` and run as Administrator.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
