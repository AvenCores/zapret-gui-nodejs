# Create a GitHub Release with auto-generated changelog when a v* tag is pushed.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron toolchain
        # See build.yml: warm cache + retries survive transient 5xx while
        # electron-builder fetches its NSIS/winCodeSign toolchain.
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-tools-${{ runner.os }}-

      - name: Build
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_on: error
          command: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $prev = (git describe --tags --abbrev=0 HEAD~1 2>$null)
          if (-not $prev) { $prev = (git rev-list --max-parents=0 HEAD) }
          $log = (git log "$prev..HEAD" --pretty=format:'- %s (%h)') -join "`n"
          if (-not $log) { $log = '- maintenance build' }
          "notes<<EOF" >> $env:GITHUB_OUTPUT
          $log >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Zapret GUI ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.notes }}

            ### Install
            - Windows: download `Zapret GUI-*-setup.exe` and run as Administrator.
            - Linux: download the `.AppImage` (any distro), `.deb` (Debian/Ubuntu)
              or `.rpm` (Fedora/RHEL/openSUSE).
              On first run use Updates → “Download Linux dependencies” to fetch `nfqws`,
              then apply a strategy (`nftables`/`iptables` + `sudo`/`doas` required).
          files: |
            dist/*.exe
            dist/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-tools-${{ runner.os }}-

      - name: Install rpm tooling
        # electron-builder shells out to `rpmbuild` for the rpm target,
        # which is not preinstalled on ubuntu-latest runners.
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Linux packages
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_on: error
          command: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append Linux packages to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
